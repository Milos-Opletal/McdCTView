services:
  web:
    build: .
    image: mcd-verification-monitor
    container_name: mcd-verification-monitor
    restart: unless-stopped
    ports:
      - "4332:8000"
    environment:
      - MYMCD_EMAIL=${MYMCD_EMAIL}
      - MYMCD_PASSWORD=${MYMCD_PASSWORD}
      - MYMCD_RESTAURANT_ID=${MYMCD_RESTAURANT_ID:-}
      - MYMCD_RESTAURANT_CODE=${MYMCD_RESTAURANT_CODE:-}
      - FLASK_SECRET_KEY=${FLASK_SECRET_KEY}
    command: gunicorn --workers 1 --threads 1 --timeout 60 -b 0.0.0.0:8000 app:app

    ipc: host
    networks:
      - nginx_default

networks:
  nginx_default:
    external: true
