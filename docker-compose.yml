services:
  web:
    build: .
    image: mcd-verification-monitor
    container_name: mcd-verification-monitor
    restart: unless-stopped
    ports:
      - "4332:8000"
    environment:
      - MCD_EMAIL=${MCD_EMAIL}
      - MCD_PASSWORD=${MCD_PASSWORD}
    command: gunicorn --workers 1 --threads 1 --timeout 60 -b 0.0.0.0:8000 app:app

    ipc: host
    networks:
      - nginx_default

networks:
  nginx_default:
    external: true
